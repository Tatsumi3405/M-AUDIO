<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Bookings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh; /* Full height of viewport */
        }

        .sidebar {
            width: 250px; /* Fixed width for sidebar */
            background: linear-gradient(to left, #1a1919, rgba(26, 25, 25, 0.8)); /* Faded dark shade */
            color: #424141; /* Updated to gray text color */
            display: flex;
            flex-direction: column; /* Stack items vertically */
            align-items: center; /* Center items horizontally */
            padding-top: 20px; /* Add spacing at the top */
            font-family: 'Courier New', Courier, monospace; /* Updated font for sidebar */
        }  

        .logo {
            width: 150px; /* Circular logo size */
            height: 150px;
            border-radius: 50%; /* Makes it circular */
            object-fit: cover; /* Ensures logo fits within its container */
            margin-bottom: 20px; /* Adds spacing below logo */
            box-shadow: 0 0 15px rgba(19, 19, 19, 0.5), 
                        -5px -5px 10px rgba(0, 0, 0, 0.7),
                        5px 5px 10px rgba(0, 0, 0, 0.7); /* Shadow on all sides */
}
        .nav {
            list-style: none; /* Removes bullet points */
            width: 75%; /* Centers navigation links */
            text-align: center;
        }

        .nav-item {
            margin-bottom: 10px; /* Adds spacing between navigation buttons */
        }

        .nav-link {
            display: block;
            padding: 15px;
            font-size: 18px;
            color: white;
            text-decoration: none;
            border: 1px solid white;
            width: 100%;
            border-radius: 10px; /* Curved corners */
            transition: box-shadow 0.3s ease, background-color 0.3s ease;
        }

        .nav-link:hover {
            background-color: #444; /* Slightly lighter gray on hover */
            box-shadow: 3px 3px 3px rgba(252, 252, 252, 0.849); /* Subtle shadow effect on hover */
        }
        
        .main-content {
            flex-grow: 1; /* Takes up remaining space next to sidebar */
            padding: 20px;
            background: linear-gradient(to right, #5e5e5e, #cfcfcf); /* Gradient from light gray to white */
        }

    .crew-card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
      padding: 38px 40px;
      min-width: 680px;
      min-height: 410px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .crew-card h2 {
      font-size: 2em;
      font-weight: 700;
      color: #222;
      margin-bottom: 10px;
    }

    .crew-actions {
      margin-bottom: 15px;
    }

    .crew-actions button {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #1a7f37;
      background: #1a7f37;
      color: #fff;
      font-weight: 500;
      cursor: pointer;
      margin-right: 10px;
      font-size: 1em;
      transition: background 0.2s;
    }
    .crew-actions button:hover {
      background: #145c27;
    }

    .crew-list {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
    }

    .crew-profile {
      background: #f2f6f8;
      border-radius: 12px;
      padding: 18px 22px;
      width: 210px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      margin-bottom: 10px;
      position: relative;
    }
    .crew-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #ccc;
      margin-bottom: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .crew-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .crew-name {
      font-weight: bold;
      font-size: 1.15em;
      color: #222;
      margin-bottom: 2px;
    }
    .crew-role {
      color: #1a7f37;
      font-size: 0.98em;
      margin-bottom: 7px;
    }
    .crew-remove {
      position: absolute;
      top: 8px;
      right: 10px;
      background: #e53935;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-size: 1em;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .crew-remove:hover {
      background: #b71c1c;
    }

    @media (max-width: 900px) {
      .crew-card {
        min-width: 340px;
        padding: 14px;
      }
      .sidebar {
        min-width: 120px;
        width: 120px;
      }
      .crew-list {
        flex-direction: column;
        gap: 16px;
      }
    }
    @media (max-width: 600px) {
      .container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        min-width: 0;
        flex-direction: row;
        justify-content: start;
        align-items: flex-start;
        padding: 10px 0;
      }
      .logo {
        margin: 0 10px 0 0;
        width: 60px;
        height: 60px;
      }
      .logo img {
        width: 50px;
        height: 50px;
      }
      .nav {
        flex-direction: row;
        gap: 5px;
        width: auto;
      }
      .nav button, .nav a {
        padding: 8px 10px;
        font-size: 0.9em;
      }
      .main-content {
        padding: 10px 0;
      }
      .crew-card {
        padding: 8px;
      }
    }
  </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <img src="436264411_950515963748200_1965576046051139400_n (1).jpg" alt="Logo" class="logo">
        <ul class="nav">
            <li class="nav-item"><a href="#" class="nav-link">OVERVIEW</a></li>
            <li class="nav-item"><a href="#" class="nav-link">BOOKINGS</a></li>
            <li class="nav-item"><a href="#" class="nav-link">SALES</a></li>
            <li class="nav-item"><a href="#" class="nav-link">CONTROL</a></li>
            <li class="nav-item"><a href="#" class="nav-link">LOG OUT</a></li>
        </ul>
    </div>
    <!-- Main Content -->
    <div class="main-content">
      <div class="crew-card">
        <h2>Crew Management</h2>
        <div class="crew-actions">
          <button>Add Crew Member</button>
        </div>
        <div class="crew-list">
          <div class="crew-profile">
            <button class="crew-remove" title="Remove">&#10006;</button>
            <div class="crew-img">
              <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Crew Member">
            </div>
            <div class="crew-name">Juan Dela Cruz</div>
            <div class="crew-role">Sound Engineer</div>
          </div>
          <div class="crew-profile">
            <button class="crew-remove" title="Remove">&#10006;</button>
            <div class="crew-img">
              <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Crew Member">
            </div>
            <div class="crew-name">Maria Santos</div>
            <div class="crew-role">Lighting Technician</div>
          </div>
          <div class="crew-profile">
            <button class="crew-remove" title="Remove">&#10006;</button>
            <div class="crew-img">
              <img src="https://randomuser.me/api/portraits/men/45.jpg" alt="Crew Member">
            </div>
            <div class="crew-name">Pedro Reyes</div>
            <div class="crew-role">Stage Manager</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
